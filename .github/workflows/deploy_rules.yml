name: Deploy QRadar Rules
on:
  push:
    branches:
      - main
    paths:
      - 'rules/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requests
        run: pip install requests

      - name: Run Sync Script
        env:
          QRADAR_IP: ${{ secrets.QRADAR_IP }}
          QRADAR_API_TOKEN: ${{ secrets.QRADAR_API_TOKEN }}
        run: python scripts/qradar_sync.py
